[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosolid"
version = "0.1.0"
description = "Núcleo de dominio CadSpec para AUTOSOLID"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.11,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "anyio>=4.5,<5",
    "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27,<1",
]

[project.scripts]
autosolid-schema = "autosolid.cad.schema:main"
autosolid-api = "autosolid.api:main"
autosolid-mcp = "autosolid.mcp:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autosolid.api" = ["static/*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
